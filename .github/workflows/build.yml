name: Build, Test & Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1)'
        required: true
        default: 'v0.1'
  push:
    branches: [ master ]

jobs:
  crypto-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run crypto vector tests
        run: make test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install & configure real sshd
        run: bash test/setup_sshd.sh
      - name: Run the real client against real sshd
        env:
          SSH_TEST_HOST: 127.0.0.1
          SSH_TEST_PORT: '2222'
          SSH_TEST_USER: sshuser
          SSH_TEST_PASS: pspsshpass
          PSPSH_DEBUG: '1'
        run: make test-integration

  psp-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build PSP EBOOT (pspdev Docker)
        run: docker run --rm -v ${{ github.workspace }}:/src -w /src pspdev/pspdev make all
      - name: Verify EBOOT produced
        run: |
          if test -f EBOOT.PBP; then echo "EBOOT OK"; else echo "FAIL: no EBOOT.PBP"; exit 1; fi
      - name: Package
        run: |
          mkdir -p build/PSPSH
          cp EBOOT.PBP build/PSPSH/
          cp README.md build/PSPSH/
          cd build && zip -r PSPSH-0.1.zip PSPSH
      - uses: actions/upload-artifact@v4
        with:
          name: pspssh-build
          path: |
            build/PSPSH-0.1.zip
            EBOOT.PBP
      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/PSPSH-0.1.zip
            EBOOT.PBP
          draft: false